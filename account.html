<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon compte – ELIOUSH GAMING</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./components/widget.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="header" id="mainHeader">
    <div class="header-container">

      <div class="logo">
        <img src="https://i.postimg.cc/rw2ZZHrP/LOGO-Elioush.jpg" alt="Logo">
        <a href="index.html">
          <span class="Elioush Gaming">ELIOUSH GAMING</span>
        </a>
      </div>

      <nav class="nav" id="mainNav">
        <button class="nav-btn" data-cat="tous" onclick="transitionTo('index.html?cat=tous')" data-i18n="nav.all">Tous</button>
        <button class="nav-btn" data-cat="vehicules" onclick="transitionTo('index.html?cat=vehicules')" data-i18n="nav.vehicles">Véhicules</button>
        <button class="nav-btn" data-cat="peintures" onclick="transitionTo('index.html?cat=peintures')" data-i18n="nav.paints">Peintures</button>
        <button class="nav-btn" data-cat="cartes" onclick="transitionTo('index.html?cat=cartes')" data-i18n="nav.maps">Maps</button>
        <button class="nav-btn" data-cat="divers" onclick="transitionTo('index.html?cat=divers')" data-i18n="nav.misc">Divers</button>
        <button class="nav-btn upload-btn" onclick="transitionTo('upload.html')" data-i18n="nav.upload">Upload</button>
        <button class="nav-btn login-btn active" data-i18n="nav.login">Se connecter</button>
        <button class="nav-btn contacts-btn" onclick="transitionTo('index.html#contact')" data-i18n="nav.contact">Contact</button>
      </nav>

      <div class="header-right">
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="🔍 Rechercher un mod..." class="search-input" data-i18n-placeholder="search.placeholder" />
          <button class="search-btn"><i class="fa fa-search"></i></button>
          <div id="searchDropdown" class="search-dropdown"></div>
        </div>

        <div class="lang-switch">
          <button class="lang-btn active" data-lang="fr">FR</button>
          <span class="lang-sep">|</span>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>

        <div class="theme-toggle">
          <input type="checkbox" id="themeToggle">
          <label for="themeToggle" class="toggle-label">
            <span class="sun"><i class="fa fa-sun"></i></span>
            <span class="moon"><i class="fa fa-moon"></i></span>
          </label>
        </div>

        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>

    </div>
  </header>

  <div class="marquee-box">
    <div class="marquee-inner">
      <span data-i18n="marquee">Bienvenue sur ELIOUSH GAMING &bull; Mods Euro Truck Simulator 2 &bull; Téléchargements gratuits &bull; Nouveaux mods régulièrement &bull;</span>
    </div>
  </div>

  <main class="account-main">
    <div id="accountLoading" class="account-status-msg" data-i18n="account.loading">Chargement de votre profil...</div>

    <div id="accountContent" class="account-content hidden">
      <section class="account-card">
        <div class="account-avatar" id="accountAvatar">?</div>
        <h1 class="account-name" id="accountName">—</h1>
        <p class="account-email" id="accountEmail">—</p>

        <div class="account-badges">
          <span class="account-badge" id="accountRoleBadge">—</span>
          <span class="account-badge account-badge-muted" id="accountSince">—</span>
        </div>

        <div class="account-steam-row" id="accountSteamRow">
          <i class="fa-brands fa-steam-symbol"></i>
          <span id="accountSteamText" data-i18n="account.steamNotLinked">Aucun compte Steam lié</span>
        </div>

        <button class="account-logout-btn" id="accountLogoutBtn" data-i18n="account.logout">Se déconnecter</button>
      </section>

      <section class="account-history">
        <h2 data-i18n="account.historyTitle">Historique de téléchargements</h2>
        <div id="accountHistoryList" class="account-history-list"></div>
      </section>

      <section class="account-history hidden" id="accountSubmissionsSection">
        <h2 data-i18n="account.submissionsTitle">Mes soumissions</h2>
        <div id="accountSubmissionsList" class="account-history-list"></div>
      </section>
    </div>
  </main>

  <div id="widget"></div>
  <div id="footer"></div>

  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./js/db.js"></script>

  <!-- Script principal (i18n, thème, menu, session partagée) -->
  <script type="module" src="./script.js"></script>

  <script type="module">
    import { onUserStateChange, getUserProfile, getUserDownloadHistory, listenUserSubmissions, logoutUser } from './js/db.js';

    const lang = localStorage.getItem('eg_lang') || 'fr';
    const roleLabels = {
      fr: { member: 'Membre', admin: 'Administrateur', creator: 'Créateur vérifié' },
      en: { member: 'Member', admin: 'Administrator', creator: 'Verified creator' }
    };
    const statusLabels = {
      fr: { pending: 'En attente', approved: 'Validé', refused: 'Refusé', review: 'À revoir' },
      en: { pending: 'Pending', approved: 'Approved', refused: 'Refused', review: 'Needs changes' }
    };
    const statusColors = { pending: '#f5a623', approved: '#00a651', refused: '#e53935', review: '#f5a623' };
    const submissionsEmpty = { fr: 'Vous n\'avez encore proposé aucun mod.', en: 'You haven\'t submitted any mods yet.' };
    const steamLabel = {
      fr: id => `Compte Steam lié : ${id}`,
      en: id => `Linked Steam account: ${id}`
    };
    const historyEmpty = { fr: 'Vous n\'avez encore téléchargé aucun mod.', en: 'You haven\'t downloaded any mods yet.' };
    const notLoggedIn = { fr: 'Vous devez être connecté pour voir cette page. Redirection...', en: 'You must be logged in to view this page. Redirecting...' };

    function formatDate(ts) {
      try {
        const d = ts?.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-US', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch { return ''; }
    }

    let unsubscribeSubmissions = null;

    onUserStateChange(async (user) => {
      const loadingEl = document.getElementById('accountLoading');
      const contentEl = document.getElementById('accountContent');

      if (unsubscribeSubmissions) { unsubscribeSubmissions(); unsubscribeSubmissions = null; }

      if (!user) {
        if (loadingEl) loadingEl.textContent = notLoggedIn[lang] || notLoggedIn.fr;
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        return;
      }

      const profile = await getUserProfile(user.uid).catch(() => null);
      const name = profile?.name || profile?.displayName || user.email?.split('@')[0] || '—';

      document.getElementById('accountAvatar').textContent = name.charAt(0).toUpperCase();
      document.getElementById('accountName').textContent = name;
      document.getElementById('accountEmail').textContent = user.email || '';

      const role = profile?.role === 'admin' ? 'admin' : (profile?.role === 'creator' ? 'creator' : 'member');
      document.getElementById('accountRoleBadge').textContent = (roleLabels[lang] || roleLabels.fr)[role];

      const joined = profile?.joined ? formatDate(profile.joined) : '';
      document.getElementById('accountSince').textContent = joined
        ? `${lang === 'fr' ? 'Membre depuis' : 'Member since'} ${joined}`
        : '';

      const steamRow = document.getElementById('accountSteamRow');
      const steamText = document.getElementById('accountSteamText');
      if (profile?.steamId) {
        steamText.textContent = (steamLabel[lang] || steamLabel.fr)(profile.steamId);
        steamRow.classList.add('linked');
      } else {
        steamText.textContent = lang === 'fr' ? 'Aucun compte Steam lié' : 'No Steam account linked';
        steamRow.classList.remove('linked');
      }

      // Historique de téléchargements
      const historyList = document.getElementById('accountHistoryList');
      const history = await getUserDownloadHistory(user.uid).catch(() => []);
      if (history.length === 0) {
        historyList.innerHTML = `<div class="account-history-empty">${historyEmpty[lang] || historyEmpty.fr}</div>`;
      } else {
        historyList.innerHTML = history.map(h => `
          <a class="account-history-item" href="index.html?id=${encodeURIComponent(h.modId)}">
            <i class="fa fa-download"></i>
            <span class="account-history-title">${h.modTitle || h.modId}</span>
            <span class="account-history-count">${h.downloadCount} téléchargement${h.downloadCount > 1 ? 's' : ''}</span>
            <span class="account-history-date">${formatDate(h.downloadedAt)}</span>
          </a>
        `).join('');
      }

      // Mes soumissions (créateur) — visible dès qu'il existe au moins une soumission liée au compte,
      // même si le rôle "creator" n'est pas encore confirmé (ex : première soumission avant liaison Steam).
      const submissionsSection = document.getElementById('accountSubmissionsSection');
      const submissionsList = document.getElementById('accountSubmissionsList');
      unsubscribeSubmissions = listenUserSubmissions(user.uid, (subs) => {
        if (role !== 'creator' && subs.length === 0) {
          submissionsSection.classList.add('hidden');
          return;
        }
        submissionsSection.classList.remove('hidden');
        if (subs.length === 0) {
          submissionsList.innerHTML = `<div class="account-history-empty">${submissionsEmpty[lang] || submissionsEmpty.fr}</div>`;
          return;
        }
        submissionsList.innerHTML = subs.map(s => {
          const status = s.status || 'pending';
          const label = (statusLabels[lang] || statusLabels.fr)[status] || status;
          const color = statusColors[status] || '#999';
          return `
            <div class="account-history-item account-submission-item">
              <i class="fa fa-file-arrow-up"></i>
              <span class="account-history-title">${s.title || '—'}</span>
              <span class="account-submission-status" style="color:${color};border-color:${color}">${label}</span>
              <span class="account-history-date">${formatDate(s.submittedAt)}</span>
            </div>
          `;
        }).join('');
      });

      loadingEl?.classList.add('hidden');
      contentEl?.classList.remove('hidden');
    });

    document.getElementById('accountLogoutBtn')?.addEventListener('click', async () => {
      await logoutUser();
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
